name: Build SA-MP Mobile APK

# SA-MP Mobile on top of Winlator Ludashi (open source, MIT).
# The repository only holds the SA-MP parts: overlay/ (new files), patches/ (changes to
# Ludashi files) and LUDASHI_COMMIT (the Ludashi version to build on). This workflow
# checks out that Ludashi commit, adds the SA-MP parts and builds the APK.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SA-MP Mobile
        uses: actions/checkout@v4
        with:
          path: samp

      - name: Check out Winlator Ludashi at the pinned commit
        run: |
          commit=$(tr -d '[:space:]' < samp/LUDASHI_COMMIT)
          git init -q ludashi
          git -C ludashi remote add origin https://github.com/StevenMXZ/Winlator-Ludashi.git
          git -C ludashi fetch -q --depth 1 origin "$commit"
          git -C ludashi checkout -q FETCH_HEAD
          git -C ludashi log -1 --format='Ludashi %H %ci %s'

      - name: Add the SA-MP parts (overlay + patches)
        working-directory: ludashi
        run: |
          cp -r ../samp/overlay/. .
          for p in ../samp/patches/*.patch; do
            echo "applying $p"
            git apply --whitespace=nowarn "$p"
          done
          git status --short

      - name: Clone libadrenotools (as Ludashi's own workflow does)
        working-directory: ludashi
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git app/src/main/cpp/adrenotools
          git -C app/src/main/cpp/adrenotools checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools ninja-build zstd gcc-mingw-w64-i686

      - name: Build the SA-MP starter (sampinject.exe, 32-bit Windows)
        working-directory: ludashi
        run: |
          mkdir -p app/src/main/assets/samp
          i686-w64-mingw32-gcc -O2 -s -static -mwindows -o app/src/main/assets/samp/sampinject.exe tools/sampinject/sampinject.c
          ls -la app/src/main/assets/samp/sampinject.exe

      - name: Bundle Khronos Vulkan validation layer (as Ludashi's own workflow does)
        working-directory: ludashi
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL \
            "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" \
            -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Build APK
        working-directory: ludashi
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp ludashi/app/build/outputs/apk/release/*.apk "out/SA-MP-Mobile-${{ github.run_number }}.apk"
          cp ludashi/app/src/main/assets/samp/sampinject.exe out/sampinject.exe
          ls -la out

      - name: Upload (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Mobile-APK
          path: out/*

      - name: Publish as a GitHub Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ludashi-build-${{ github.run_number }}
          name: SA-MP Mobile (Ludashi) build ${{ github.run_number }}
          files: |
            out/*.apk
            out/sampinject.exe
          prerelease: true
